<div class="nota-fiscal-page-layout">
  <div class="d-flex flex-grow-1 flex-fill">
    <app-sidebar></app-sidebar>
    <main class="nota-fiscal-container flex-grow-1 main-content-with-sidebar">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Notas Fiscais</h2>
        <div class="d-flex gap-2">
          <button class="btn btn-info" type="button" (click)="consultarNfe()">
            <i class="fas fa-search me-2"></i>
            Consultar NFe
          </button>
          <button class="btn btn-primary" type="button" (click)="createNfe()">
            Nova Nota Fiscal
          </button>
        </div>
      </div>

      <div *ngIf="loading" class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
      </div>

      <div *ngIf="!loading">
        <table class="table table-striped table-bordered" *ngIf="nfeList.length > 0; else noData">
          <thead>
            <tr>
              <th>Número</th>
              <th>Data de Emissão</th>
              <th>Cliente</th>
              <th>Valor Total</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let nfe of nfeList">
              <td>{{ nfe.numero }}</td>
              <td>{{ nfe.dataEmissao | date:'dd/MM/yyyy' }}</td>
              <td>{{ nfe.cliente }}</td>
              <td>R$ {{ nfe.valorTotal | number:'1.2-2' }}</td>
              <td>{{ nfe.status }}</td>
              <td>
                <button class="btn btn-sm btn-outline-secondary me-2" (click)="editNfe(nfe)">Editar</button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteNfe(nfe.id!)">Excluir</button>
              </td>
            </tr>
          </tbody>
        </table>

        <ng-template #noData>
          <div class="text-center mt-4">
            <p class="text-muted">Nenhuma nota fiscal encontrada.</p>
          </div>
        </ng-template>
      </div>
