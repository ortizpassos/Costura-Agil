<div class="d-flex align-items-center py-5" style="min-height: 100vh; background: #CBE0FF;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="text-center mb-4">
          <h1 class="h3 fw-bold">Sistema Financeiro</h1>
          <p class="text-muted small mb-0">Acesse sua conta para continuar</p>
        </div>
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">{{ mode === 'login' ? 'Entrar' : 'Criar Conta' }}</h5>
            <form (ngSubmit)="onSubmit()">
              <div class="mb-3" *ngIf="mode === 'register'">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" [(ngModel)]="name" name="name" placeholder="Seu nome" />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="email@exemplo.com" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="••••••" required />
              </div>
              <div class="small text-danger mb-2" *ngIf="error">{{ error }}</div>
              <button class="btn btn-primary w-100" type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Carregando...' : (mode === 'login' ? 'Entrar' : 'Registrar') }}
              </button>
            </form>
            <div class="mt-3 text-center small">
              <a href="#" (click)="toggleMode($event)">{{ mode === 'login' ? 'Criar conta' : 'Já tenho conta' }}</a>
            </div>
            <div class="mt-3 text-center">
              <a routerLink="/" class="small">Voltar à Home</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
